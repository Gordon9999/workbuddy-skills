<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HEADLINE}}</title>
    <style>
        /* ===== 基础重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 页面容器 ===== */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ===== 文章头部（FT 风格） ===== */
        .article-header {
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .article-header .kicker {
            font-size: 0.78rem;
            font-weight: 600;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.6rem;
        }
        .article-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.35;
            margin-bottom: 0.8rem;
            letter-spacing: -0.01em;
        }
        .article-header .standfirst {
            font-size: 1.05rem;
            color: #475569;
            line-height: 1.6;
            font-weight: 400;
        }

        /* ===== 一级标题（大段分隔） ===== */
        .part-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0f172a;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px solid #1e293b;
            letter-spacing: 0.02em;
        }

        /* ===== 二级标题（小节内分节） ===== */
        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
            margin-top: 1.8rem;
            margin-bottom: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #e2e8f0;
        }

        /* ===== 正文段落 ===== */
        .article-body p {
            font-size: 1rem;
            color: #1e293b;
            line-height: 1.8;
            margin-bottom: 0.6rem;
        }
        .article-body p:last-child {
            margin-bottom: 0;
        }

        /* ===== 绿色高亮 ===== */
        .highlight {
            color: #16a34a;
            font-weight: 500;
        }

        /* ===== 引用块 ===== */
        .quote-block {
            margin: 1.5rem 0;
            padding: 1rem 1.2rem;
            border-left: 3px solid #2563eb;
            background: #f8fafc;
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.7;
        }

        /* ===== 尾部信息 ===== */
        .footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .footer .footer-meta {
            margin-bottom: 0.3rem;
            line-height: 1.6;
        }
        .footer .footer-meta:last-child {
            margin-bottom: 0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container { padding: 1.5rem 1rem 3rem; }
            .article-header h1 { font-size: 1.4rem; }
            .article-header .standfirst { font-size: 0.95rem; }
            .article-header .kicker { font-size: 0.72rem; }
            .part-title { font-size: 1.15rem; }
            .section-title { font-size: 1.05rem; }
            .article-body p { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== 文章头部 ===== -->
    <div class="article-header">
        <div class="kicker">{{KICKER}}</div>
        <h1>{{HEADLINE}}</h1>
        <div class="standfirst">{{STANDFIRST}}</div>
    </div>

    <!-- ===== 正文 ===== -->
    <div class="article-body">
        <p>{{PARAGRAPH_1}}</p>
        <p>{{PARAGRAPH_2}}</p>

        <!-- 如需多级标题（一级用 part-title，二级用 section-title） -->
        <!--
        <div class="part-title">一、大段标题</div>

        <div class="section-title">小节标题</div>
        <p>{{PARAGRAPH}}</p>
        -->

        <!-- 如需引用 -->
        <!--
        <div class="quote-block">{{QUOTE}}</div>
        -->

        <!-- 如需表格 -->
        <!--
        <table style="width:100%;border-collapse:collapse;margin:1rem 0;font-size:0.92rem;">
            <tr><th style="background:#1e293b;color:#fff;padding:0.6rem 0.8rem;text-align:left;font-weight:600;">列头</th></tr>
            <tr><td style="padding:0.55rem 0.8rem;border-bottom:1px solid #eef2f6;">内容</td></tr>
        </table>
        -->
    </div>

    <!-- ===== 尾部信息 ===== -->
    <div class="footer">
        <div class="footer-meta">生成日期：{{DATE}}</div>
        <div class="footer-meta">来源：{{SOURCE}}</div>
        <div class="footer-meta">{{LLM_ATTRIBUTION}}</div>
    </div>

</div>
</body>
</html>
